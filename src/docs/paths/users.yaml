paths:
    /users/:
        get:
            tags: [Users]
            summary: List users (admin only)
            description: |
                Returns a paginated list of user accounts. Supports search,
                pagination, and sorting. Requires the `ADMIN` role.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/OffsetQuery'
                - $ref: '#/components/parameters/LimitQuery'
                - $ref: '#/components/parameters/SearchQuery'
                - $ref: '#/components/parameters/CountQuery'
                - $ref: '#/components/parameters/UserOrderByQuery'
            responses:
                '200':
                    description: A paginated list of users.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/User'
                                    meta:
                                        $ref: '#/components/schemas/PaginationMeta'
                            example:
                                data:
                                    - id: 8f3c2f5e-2e1b-4d3a-9c8e-7d6c5b4a3f2e
                                      username: johndoe
                                      name: John Doe
                                      email: john@example.com
                                      joinDate: '2026-07-15T10:30:00.000Z'
                                      role: USER
                                meta:
                                    offset: 0
                                    limit: 10
                                    total: 1
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                default:
                    $ref: '#/components/responses/InternalServerError'

    /users/{userId}:
        get:
            tags: [Users]
            summary: Get a user by id
            description: Returns a single user. Only the user themselves or an admin may read the record.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/UserIdPath'
            responses:
                '200':
                    description: User found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                default:
                    $ref: '#/components/responses/InternalServerError'

        patch:
            tags: [Users]
            summary: Update a user
            description: |
                Admin or self-update of a user record. Changing the email triggers a
                fresh verification flow.
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/UserIdPath'
            requestBody:
                $ref: '#/components/requestBodies/UpdateUserRequest'
            responses:
                '200':
                    description: Updated user.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    description: Username or email conflicts with another user.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConflictError'
                default:
                    $ref: '#/components/responses/InternalServerError'

        delete:
            tags: [Users]
            summary: Soft-delete a user
            description: Marks the user as deleted (the record is retained but hidden).
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/UserIdPath'
            responses:
                '200':
                    description: Deletion acknowledged.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                            example:
                                message: User deleted successfully
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                default:
                    $ref: '#/components/responses/InternalServerError'
