components:
    requestBodies:
        RegisterRequest:
            required: true
            description: Payload required to register a new account.
            content:
                application/json:
                    schema:
                        type: object
                        required: [username, name, email, password]
                        properties:
                            username:
                                type: string
                                minLength: 3
                                maxLength: 50
                                example: johndoe
                            name:
                                type: string
                                minLength: 1
                                maxLength: 100
                                example: John Doe
                            email:
                                type: string
                                format: email
                                example: john@example.com
                            password:
                                type: string
                                format: password
                                minLength: 8
                                description: At least 8 characters, with upper, lower, and numeric characters.
                                example: Str0ngPass!
                    examples:
                        valid:
                            summary: Valid signup
                            value:
                                username: johndoe
                                name: John Doe
                                email: john@example.com
                                password: Str0ngPass!

        LoginRequest:
            required: true
            description: Email and password used to obtain a JWT.
            content:
                application/json:
                    schema:
                        type: object
                        required: [email, password]
                        properties:
                            email:
                                type: string
                                format: email
                                example: john@example.com
                            password:
                                type: string
                                format: password
                                example: Str0ngPass!

        ResendConfirmationRequest:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [email]
                        properties:
                            email:
                                type: string
                                format: email
                                example: john@example.com

        InitiatePasswordChangeRequest:
            required: true
            description: Send the current password to start the password-change flow.
            content:
                application/json:
                    schema:
                        type: object
                        required: [oldPassword]
                        properties:
                            oldPassword:
                                type: string
                                format: password
                                example: OldP@ssword1

        ConfirmPasswordChangeRequest:
            required: true
            description: Provide the emailed token together with the new password.
            content:
                application/json:
                    schema:
                        type: object
                        required: [token, newPassword]
                        properties:
                            token:
                                type: string
                                description: Token mailed to the user after initiating the change.
                                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                            newPassword:
                                type: string
                                format: password
                                minLength: 8
                                description: Must differ from the previous password.
                                example: NewStr0ngPass!

        UpdateUserRequest:
            required: true
            description: Partial update for an existing user (admin or self).
            content:
                application/json:
                    schema:
                        type: object
                        minProperties: 1
                        properties:
                            username:
                                type: string
                                minLength: 3
                                maxLength: 50
                            name:
                                type: string
                                minLength: 1
                                maxLength: 100
                            email:
                                type: string
                                format: email

        UpdateProfileRequest:
            required: true
            description: Update the authenticated user's own profile.
            content:
                application/json:
                    schema:
                        type: object
                        minProperties: 1
                        properties:
                            username:
                                type: string
                                minLength: 3
                                maxLength: 50
                            name:
                                type: string
                                minLength: 1
                                maxLength: 100
                            email:
                                type: string
                                format: email

        CreateStoryRequest:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [userId, title, body]
                        properties:
                            title:
                                type: string
                                minLength: 10
                                maxLength: 100
                                example: The Curious Case of the Missing Semicolon
                            body:
                                type: string
                                minLength: 100
                                maxLength: 10000
                                example: It was a quiet evening in the repository when something started to drift...
                            categoryIds:
                                type: array
                                items:
                                    type: string
                                    format: uuid
                                example:
                                    - 9a2c1c08-19eb-4e74-9b54-1dc1e6b2f81a

                            generateSummary:
                                type: boolean
                                description: When `true`, the server calls the AI service to generate a summary from the `body`.
                                example: false

        UpdateStoryRequest:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        minProperties: 1
                        properties:
                            userId:
                                type: string
                                format: uuid
                            title:
                                type: string
                                minLength: 10
                                maxLength: 100
                            body:
                                type: string
                                minLength: 100
                                maxLength: 10000
                            categoryIds:
                                type: array
                                items:
                                    type: string
                                    format: uuid
                            summary:
                                type: string
                                minLength: 1
                                maxLength: 500
                            generateSummary:
                                type: boolean

        CreateCategoryRequest:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [name]
                        properties:
                            name:
                                type: string
                                minLength: 1
                                example: Technology
                            description:
                                type: string
                                nullable: true
                                example: Posts about modern web technologies.

        UpdateCategoryRequest:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        minProperties: 1
                        properties:
                            name:
                                type: string
                                minLength: 1
                            description:
                                type: string
                                nullable: true
